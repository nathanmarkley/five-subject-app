<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Five Subject Notebook</title>
  <script>
    // Standard GitHub Pages SPA redirect: preserve path as query param
    var path = window.location.pathname;
    var base = '/five-subject-app';
    var rest = path.slice(base.length) || '/';
    var search = window.location.search;
    var hash = window.location.hash;
    var redirect = base + '/?p=' + encodeURIComponent(rest + search) + hash;
    window.location.replace(redirect);
  </script>
</head>
<body></body>
</html>
